<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Гроза морей — мобильный прототип</title><style>
*{box-sizing:border-box}body{margin:0;background:#07182b;color:#e9f4ee;font:14px system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:fixed;top:0;left:0;right:0;display:flex;gap:5px;justify-content:space-around;padding:9px 5px;background:#102439e8;z-index:2;font-size:12px}.hud span{white-space:nowrap}#note{position:fixed;top:51px;left:50%;transform:translateX(-50%);max-width:92%;text-align:center;background:#10273cde;border:1px solid #73939c;padding:8px 12px;border-radius:10px;pointer-events:none;z-index:2}#controls{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}button{background:#1e4963;color:#fff;border:1px solid #6094a9;border-radius:11px;padding:12px;font-weight:700;touch-action:manipulation}#controls button{pointer-events:auto;min-width:61px;min-height:56px}#controls .nav{display:grid;grid-template-columns:repeat(3,62px);gap:5px}#controls .nav #up{grid-column:2}#controls .nav #left{grid-column:1;grid-row:2}#controls .nav #down{grid-column:2;grid-row:2}#controls .nav #right{grid-column:3;grid-row:2}#controls .actions{display:flex;align-items:end;gap:6px}#panel{position:fixed;left:50%;top:51%;transform:translate(-50%,-50%);width:min(94vw,430px);max-height:78dvh;overflow:auto;background:#112b40f5;border:2px solid #76a6ae;border-radius:16px;padding:16px;z-index:4;box-shadow:0 14px 40px #0009}#panel[hidden]{display:none}#panel h2{margin:0 0 8px}#panel button{width:100%;display:block;margin:7px 0;text-align:left}#panel .exit{background:#623a39}small{color:#bfd5da}#help{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);font-size:11px;text-align:center;background:#102439b8;padding:5px;border-radius:6px;white-space:nowrap} </style></head><body><div class="hud" id="hud"></div><div id="note">Подплыви к острову и нажми «Остров»</div><canvas id="game"></canvas><div id="help">Стрелки — движение • «Остров» — хозяйство • «Сохранить» — прогресс</div><div id="controls"><div class="nav"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div class="actions"><button id="visit">🏝️ Остров</button><button id="save">💾</button></div></div><section id="panel" hidden><div id="panelContent"></div><button class="exit" id="close">Закрыть ✕</button></section><script>
'use strict';const C=document.querySelector('#game'),ctx=C.getContext('2d'),H=document.querySelector('#hud'),panel=document.querySelector('#panel'),pc=document.querySelector('#panelContent'),note=document.querySelector('#note');let W=innerWidth,V=innerHeight,dpr=1;function resize(){W=innerWidth;V=innerHeight;dpr=Math.min(devicePixelRatio||1,2);C.width=W*dpr;C.height=V*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const spec={wood:{label:'🌲 Древесина',period:15,cap:40},stone:{label:'🪨 Камень',period:20,cap:30},wool:{label:'🐑 Шерсть',period:25,cap:25}};
const templates=[{name:'Столица',x:330,y:290,r:92,types:[],capital:true},{name:'Лесной',x:780,y:250,r:71,types:['wood']},{name:'Каменный',x:1150,y:410,r:72,types:['stone']},{name:'Зелёный',x:735,y:720,r:80,types:['wood','wool']},{name:'Овечий',x:1280,y:780,r:75,types:['wool','stone']},{name:'Мыс',x:360,y:940,r:67,types:['wood','stone']}];
let state;function fresh(){return{player:{x:380,y:390,a:0},stock:{wood:0,stone:0,wool:0},islands:templates.map(t=>({...t,worker:false,house:false,shipyard:false,zones:Object.fromEntries(t.types.map(k=>[k,{active:false,amount:0,clock:0}]))})),ships:[],time:0,seq:0}}function load(){try{let x=JSON.parse(localStorage.getItem('groza_mobile_v1'));if(x&&x.islands?.length===templates.length)return x}catch{}return fresh()}state=load();let near=null,activePanel=false,last=performance.now(),keys=new Set(),messageUntil=0;
function message(s){note.textContent=s;messageUntil=performance.now()+3700}function save(){localStorage.setItem('groza_mobile_v1',JSON.stringify(state));message('Игра сохранена на этом устройстве')}
function nearIsland(){return state.islands.find(i=>Math.hypot(state.player.x-i.x,state.player.y-i.y)<i.r+120)}function valid(k,n){return(state.stock[k]||0)>=n}function pay(req){if(!Object.entries(req).every(([k,n])=>valid(k,n))){message('Недостаточно ресурсов на главном складе');return false}for(let[k,n]of Object.entries(req))state.stock[k]-=n;return true}
function btn(label,fn,sub=''){const b=document.createElement('button');b.textContent=label+(sub?' — '+sub:'');b.onclick=fn;pc.appendChild(b)}function line(s,tag='p'){const e=document.createElement(tag);e.textContent=s;pc.appendChild(e)}
function view(i){near=i;panel.hidden=false;activePanel=true;pc.replaceChildren();line(i.capital?'🏰 Столица':'🏝️ '+i.name,'h2');if(i.capital){line('Здесь хранится весь автоматически доставленный и собранный груз.');line('Главный склад: '+Object.entries(state.stock).map(([k,v])=>spec[k].label+' '+Math.floor(v)).join(' · '));}
for(const k of i.types){let z=i.zones[k],s=spec[k];line(`${s.label}: ${z.amount}/${s.cap} • ${z.active?'добыча идёт':'не активировано'}`);if(!z.active)btn('🔓 Открыть месторождение',()=>{z.active=true;message('Производство запущено!');view(i)});else btn('📦 Забрать '+z.amount,()=>{if(z.amount){state.stock[k]+=z.amount;z.amount=0;message('Ресурсы доставлены на главный склад')}view(i)},'вручную');}
if(!i.house&&i.types.length)btn('🏠 Построить домик и нанять работника',()=>{if(pay({wood:12,stone:5})){i.house=true;i.worker=true;message('Работник собирает ресурсы автоматически')}view(i)},'12 дерева, 5 камня');if(i.house)line('🚶 Работник: собирает накопления и отвозит их на главный склад.');
if(!i.shipyard)btn('⚒️ Построить верфь',()=>{if(pay({wood:100,stone:40,wool:30})){i.shipyard=true;message('Верфь построена!')}view(i)},'100 дерева, 40 камня, 30 шерсти');else{line('⚒️ Верфь работает');btn('⛵ Построить торговое судно',()=>{if(pay({wood:60,wool:20})){state.ships.push({from:state.islands.indexOf(i),to:0,phase:'out',progress:0,cargo:{},id:++state.seq});message('Торговое судно вышло на маршрут')}view(i)},'60 дерева, 20 шерсти');}
line('Судов на маршрутах: '+state.ships.filter(s=>s.from===state.islands.indexOf(i)).length);line('Для испытаний стартовые запасы: 100 дерева, 40 камня, 30 шерсти. В меню 💾 — сброс игры.','small')}
function close(){panel.hidden=true;activePanel=false}document.querySelector('#close').onclick=close;document.querySelector('#visit').onclick=()=>{let i=nearIsland();if(i)view(i);else message('Подплыви ближе к острову')};document.querySelector('#save').onclick=()=>{save();if(confirm('Сбросить прогресс и начать заново? Нажми ОК для сброса.')){state=fresh();state.stock={wood:100,stone:40,wool:30};save();close()}};
for(let id of ['up','down','left','right']){let el=document.getElementById(id);let clear=()=>keys.delete(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(id);el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',clear);el.addEventListener('pointercancel',clear);el.addEventListener('lostpointercapture',clear)}let mapping={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};addEventListener('keydown',e=>{if(mapping[e.key]){keys.add(mapping[e.key]);e.preventDefault()}if(e.key==='Escape')close()});addEventListener('keyup',e=>{if(mapping[e.key])keys.delete(mapping[e.key])});
if(!localStorage.getItem('groza_mobile_v1')){state.stock={wood:100,stone:40,wool:30};save()}
function update(dt){if(activePanel)return;let p=state.player,move=(keys.has('up')?1:0)-(keys.has('down')?1:0),turn=(keys.has('right')?1:0)-(keys.has('left')?1:0);p.a+=turn*dt*1.9;p.x=Math.max(45,Math.min(1550,p.x+Math.sin(p.a)*move*dt*130));p.y=Math.max(45,Math.min(1110,p.y-Math.cos(p.a)*move*dt*130));state.time+=dt;for(let i of state.islands)for(let[k,z]of Object.entries(i.zones)){if(!z.active)continue;let s=spec[k];if(z.amount<s.cap){z.clock+=dt;while(z.clock>=s.period&&z.amount<s.cap){z.amount++;z.clock-=s.period}}if(i.worker&&z.amount&&Math.floor(state.time)%12===0&&state.time%12<dt){state.stock[k]+=z.amount;z.amount=0}}
for(let s of state.ships){let i=state.islands[s.from];s.progress+=dt/23;if(s.progress>=1){s.progress=0;if(s.phase==='out'){for(let k of i.types){let n=Math.min(i.zones[k].amount,100);s.cargo[k]=n;i.zones[k].amount-=n}s.phase='back'}else{for(let[k,n]of Object.entries(s.cargo))state.stock[k]+=n;s.cargo={};s.phase='out';message('Торговое судно доставило груз в столицу')}}}if(state.time%15<dt)localStorage.setItem('groza_mobile_v1',JSON.stringify(state))}
function draw(){ctx.fillStyle='#0e5577';ctx.fillRect(0,0,W,V);let zoom=Math.min(W/600,V/730,1.1);zoom=Math.max(.5,zoom);let ox=W/2-state.player.x*zoom,oy=V/2-state.player.y*zoom;ctx.save();ctx.translate(ox,oy);ctx.scale(zoom,zoom);let minx=-ox/zoom,miny=-oy/zoom,maxx=minx+W/zoom,maxy=miny+V/zoom;for(let x=Math.floor(minx/90)*90;x<maxx;x+=90)for(let y=Math.floor(miny/90)*90;y<maxy;y+=90){ctx.strokeStyle='#72a8be22';ctx.beginPath();ctx.arc(x+10,y+10,14,0,3.1);ctx.stroke()}
for(let i of state.islands){ctx.fillStyle='#3da4a2';ctx.beginPath();ctx.arc(i.x,i.y,i.r+13,0,7);ctx.fill();ctx.fillStyle='#e1c887';ctx.beginPath();ctx.arc(i.x,i.y,i.r+4,0,7);ctx.fill();ctx.fillStyle='#367a4b';ctx.beginPath();ctx.arc(i.x,i.y,i.r-8,0,7);ctx.fill();ctx.textAlign='center';ctx.font='bold 19px system-ui';ctx.fillStyle='#fff';ctx.fillText(i.capital?'🏰':'🏝️',i.x,i.y-9);ctx.font='bold 13px system-ui';ctx.fillText(i.name,i.x,i.y+19);for(let index=0;index<i.types.length;index++){let k=i.types[index],angle=index*2.7-1.3,z=i.zones[k],xx=i.x+Math.cos(angle)*i.r*.57,yy=i.y+Math.sin(angle)*i.r*.57;ctx.fillStyle=z.active?'#e6be68':'#5d7171';ctx.beginPath();ctx.arc(xx,yy,15,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.fillText(k==='wood'?'🌲':k==='stone'?'⛏️':'🐑',xx,yy+5);if(z.active){ctx.strokeStyle='#f3d88b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(xx,yy,17,0,7);ctx.stroke()}}if(i.house){ctx.font='20px system-ui';ctx.fillText('🏠',i.x-35,i.y+43)}if(i.shipyard){ctx.font='20px system-ui';ctx.fillText('⚒️',i.x+34,i.y+40)}}
for(let s of state.ships){let a=state.islands[s.from],b=state.islands[0],t=s.phase==='out'?s.progress:1-s.progress,x=b.x+(a.x-b.x)*t,y=b.y+(a.y-b.y)*t;ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(a.y-b.y,a.x-b.x));ctx.fillStyle='#ddbe81';ctx.fillRect(-8,-4,16,8);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-7,-14);ctx.lineTo(3,-14);ctx.fill();ctx.restore()}
let p=state.player;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='#172c32';ctx.beginPath();ctx.moveTo(0,-27);ctx.lineTo(12,15);ctx.lineTo(0,25);ctx.lineTo(-12,15);ctx.closePath();ctx.fill();ctx.fillStyle='#af7650';ctx.fillRect(-7,-13,14,24);ctx.fillStyle='#f8f1d0';ctx.fillRect(-10,-6,20,5);ctx.fillRect(-8,6,16,5);ctx.restore();ctx.restore();H.innerHTML=`<span>🌲 ${Math.floor(state.stock.wood)}</span><span>🪨 ${Math.floor(state.stock.stone)}</span><span>🐑 ${Math.floor(state.stock.wool)}</span><span>⛵ ${state.ships.length}</span>`;if(performance.now()>messageUntil){let i=nearIsland();note.textContent=i?'Рядом: '+i.name+' — нажми «Остров»':'Плыви к острову и открой его хозяйство'}}function loop(now){let dt=Math.min((now-last)/1000,.1);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
